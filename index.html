<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR - Pruebas HDR (Resucitado)</title>

<!-- Librerías de la versión mágica -->
<script src="https://aframe.io"></script>
<script src="https://unpkg.com"></script>
<script type="module" src="https://unpkg.com"></script>

<style>
#prueba { font-size: 22px; color: white; text-shadow: 0 0 10px black; margin-bottom: 12px; }
html, body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background: #1f1a17; }
#mvContainer { position: fixed; top: 0; left: 0; width: 100%; height: 40%; background: #1f1a17; z-index: 40; }
model-viewer { width: 100%; height: 100%; background: transparent; filter: saturate(0.87) contrast(0.88); opacity: 0; transition: opacity 0.5s ease; }
#startScreen { position: fixed; top: 40%; left: 0; right: 0; bottom: 0; background: url("Loading screen.png") center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 20%; z-index: 30; }
.arrowContainer { display:flex; gap:20px; margin-bottom:10px; }
.arrow { font-size: 28px; padding: 10px 16px; background: rgba(255,255,255,0.9); border-radius: 12px; border: none; }
.button { background: white; color: black; padding: 14px 28px; border-radius: 30px; font-size: 16px; border: none; }
#arContainer { position: fixed; inset: 0; background: transparent; z-index: 51; display: none; }
a-scene, a-scene canvas, #arContainer video { background: transparent !important; }
a-scene { width:100%; height:100%; }
#lightDebug { position: fixed; top: 20px; left: 20px; z-index: 9999; color: white; font-size: 22px; text-shadow: 0 0 10px black; pointer-events: none; display: none; }
</style>
</head>

<body>

<div id="mvContainer"></div>

<div id="startScreen">
  <div id="prueba">Prueba Fusion Mágica HDR</div>
  <div id="label">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">?</button>
    <button class="arrow" onclick="next()">?</button>
  </div>

  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<div id="arContainer"></div>
<button id="envToggle" onclick="toggleEnv()" style="display:none; position: fixed; bottom: 20px; right: 20px; z-index: 99999; padding: 12px 16px; border-radius: 12px; border: none; background: white; color: black; font-size: 14px;">
  Env: HDR
</button>

<div id="lightDebug">LIGHT --</div>

<!-- El orden de carga definitivo en el cuerpo -->
<script src="xr-config.js"></script>
<script src="bridge.js"></script>
<script src="aframe_app.js"></script>
<script src="menu.js"></script>
</body>
</html>
