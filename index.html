<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR - Pruebas HDR</title>
<!-- version 161.1 - Model always visible, SLAM-like: stays at last known position if tracking lost -->

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
#prueba {
  font-size: 22px;
  color: white;
  text-shadow: 0 0 10px black;
  margin-bottom: 12px;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #1f1a17;
}

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: #1f1a17;
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  filter: saturate(0.87) contrast(0.88);
  opacity: 0;
  transition: opacity 0.5s ease;
}

#startScreen {
  position: fixed;
  top: 40%;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

.arrowContainer { display:flex; gap:20px; margin-bottom:10px; }

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

#arContainer {
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 51;
  display: none;
}

a-scene, a-scene canvas, #arContainer video {
  background: transparent !important;
}

a-scene { width:100%; height:100%; }
.mindar-ui-scanning { z-index:99998 !important; }

#lightDebug {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  color: white;
  font-size: 12px;
  text-shadow: 0 0 10px black;
  pointer-events: none;
  display: none;
  font-family: monospace;
  background: rgba(0,0,0,0.7);
  padding: 8px;
  border-radius: 4px;
  max-width: 300px;
}

#envToggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 99999;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  background: white;
  color: black;
  font-size: 14px;
  cursor: pointer;
  display: none;
}

#versionPanel {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 99998;
  background: rgba(0,0,0,0.85);
  color: #00ff00;
  padding: 12px;
  border-radius: 8px;
  font-size: 11px;
  font-family: monospace;
  max-height: 200px;
  overflow-y: auto;
  cursor: pointer;
  user-select: none;
  white-space: pre-wrap;
  word-break: break-word;
}

#versionPanel.collapsed {
  max-height: 20px;
  overflow: hidden;
}
</style>
</head>

<body>

<div id="mvContainer"></div>

<div id="startScreen">
  <div id="prueba">Prueba Fusion 161.1</div>
  <div id="label">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">&#8592;</button>
    <button class="arrow" onclick="next()">&#8594;</button>
  </div>

  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<div id="arContainer"></div>

<button id="envToggle" onclick="toggleEnv()">Env: HDR</button>

<div id="lightDebug">LIGHT --</div>

<div id="versionPanel">VERSION v161.1
Model always visible (SLAM-like)</div>

<script>
// =====================================================
// VERSION TRACKING
// =====================================================
window.RepoFusionVersions = window.RepoFusionVersions || {};
window.RepoFusionVersions.index = "161.1";

// =====================================================
// RepoFusion bridge listener
// =====================================================
window.RepoFusion = window.RepoFusion || {};
window.RepoFusion.pose = {
  camera: null,
  marker: null,
  intrinsics: null,
  tracking: "waiting"
};

window.RepoFusion.setPose = function (data) {
  if (!data) return;
  window.RepoFusion.pose.camera = data.camera || null;
  window.RepoFusion.pose.marker = data.marker || null;
  window.RepoFusion.pose.intrinsics = data.intrinsics || null;
  window.RepoFusion.pose.tracking = data.tracking || "unknown";
};

// =====================================================
// APPLICATION STATE
// =====================================================
let current = 0;
let envEnabled = true;
let originalEnv = null;
let cameraEnv = null;
let envMode = "hdr";
let pmremGenerator = null;
let cameraRT = null;
let envInterval = null;
let arIntervalId = null;
let xrLoadPromise = null;
let envTexture = null;
let envCanvas = null;
let video = null;
let mv = null;

const models = [
  "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
  "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
  "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
  "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

// =====================================================
// UTILITY FUNCTIONS
// =====================================================

function loadScript({ id, src, async = false, attrs = {} }) {
  if (document.getElementById(id)) return;
  const script = document.createElement("script");
  script.id = id;
  script.src = src;
  if (async) script.async = true;
  Object.entries(attrs).forEach(([key, value]) => script.setAttribute(key, value));
  document.body.appendChild(script);
}

function loadXR8Assets() {
  loadScript({ id: "runtimeScript", src: "./external/runtime/runtime.js" });
  loadScript({ id: "xrScript", src: "./external/xr/xr.js", async: true, attrs: { "data-preload-chunks": "face, slam" } });
  loadScript({ id: "bundleScript", src: "bundle.js" });
  loadScript({ id: "bridgeScript", src: "bridge.js?t=" + Date.now() });
}

function waitForXR8() {
  if (!xrLoadPromise) {
    xrLoadPromise = new Promise((resolve) => {
      const onXRLoaded = () => resolve(window.XR8);
      if (window.XR8) {
        resolve(window.XR8);
      } else {
        window.addEventListener("xrloaded", onXRLoaded, { once: true });
        window.addEventListener("XRloaded", onXRLoaded, { once: true });
      }
    });
  }
  return xrLoadPromise;
}

// =====================================================
// MODEL VIEWER FUNCTIONS
// =====================================================

function createMV(){
  const container = document.getElementById("mvContainer");
  container.innerHTML = `
    <model-viewer
      id="mv"
      src="${models[current]}"
      autoplay
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="17deg"
      camera-orbit="0deg 70deg 45%"
      min-camera-orbit="0deg 0deg 45%"
      max-camera-orbit="360deg 90deg 45%"
      camera-controls="false"
      touch-action="none"
      disable-pan
      disable-zoom
      interaction-prompt="none"
      shadow-intensity="0.4"
      exposure="0.80"
      style="background-color:#1f1a17;">
    </model-viewer>`;

  mv = document.getElementById("mv");
  mv.addEventListener("load", () => mv.style.opacity = "1", {once:true});
  document.getElementById("label").innerText = "Plato " + (current + 1);
}

function updateMV(){
  if (!mv) return;
  mv.style.opacity = "0";
  mv.setAttribute("src", models[current]);
  mv.addEventListener("load", () => mv.style.opacity = "1", {once:true});
  document.getElementById("label").innerText = "Plato " + (current + 1);
}

function destroyMV(){
  document.getElementById("mvContainer").innerHTML = "";
  mv = null;
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateMV();
}

function next(){
  current = (current + 1) % models.length;
  updateMV();
}

// =====================================================
// AR SCENE FUNCTIONS
// =====================================================

function createARScene(){
  const container = document.getElementById("arContainer");
  container.innerHTML = `
    <a-scene
      renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 1.01; toneMapping: ACESFilmicToneMapping;"
      color-space="sRGB"
      vr-mode-ui="enabled:false"
      device-orientation-permission-ui="enabled:false">
      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
      <a-entity id="trackingRoot">
        <a-gltf-model id="aframeModel" src="${models[current]}" rotation="90 0 0" scale="8 8 8"></a-gltf-model>
      </a-entity>
    </a-scene>`;

  const sceneEl = container.querySelector("a-scene");
  sceneEl.addEventListener("loaded", () => {
    // 1. Tracking update loop - ALWAYS render, update when data available
    if (arIntervalId) clearInterval(arIntervalId);
    arIntervalId = setInterval(() => {
      const root = document.getElementById("trackingRoot");
      if (!root) return;
      
      // Update position if marker data exists, otherwise keep last known position
      if (window.RepoFusion && window.RepoFusion.pose.marker) {
        const marker = window.RepoFusion.pose.marker;
        if (marker.position && marker.rotation) {
          root.object3D.position.set(marker.position.x, marker.position.y, marker.position.z);
          root.object3D.quaternion.set(marker.rotation.x, marker.rotation.y, marker.rotation.z, marker.rotation.w);
        }
      }
      // If no marker, model stays visible at last position (simulates SLAM)
    }, 30);

    // 2. PMREM setup for HDR
    pmremGenerator = new THREE.PMREMGenerator(sceneEl.renderer);
    pmremGenerator.compileEquirectangularShader();
    console.log("[AR] PMREM initialized");

    // Try to find video element (8th Wall creates it), but don't block rendering
    const waitForVideo = setInterval(() => {
      const candidate = document.querySelector("video");
      if (candidate && candidate.readyState >= 2 && !video) {
        console.log("[AR] Video element found");
        video = candidate;
        cameraEnv = new THREE.VideoTexture(video);
        cameraEnv.colorSpace = THREE.SRGBColorSpace;

        envCanvas = document.createElement("canvas");
        envCanvas.width = 64;
        envCanvas.height = 64;
        envTexture = new THREE.CanvasTexture(envCanvas);
        envTexture.mapping = THREE.EquirectangularReflectionMapping;
        const ctx = envCanvas.getContext("2d");
        let smoothed = 120;

        envInterval = setInterval(() => {
          if (!video || video.readyState < 2) return;
          ctx.drawImage(video, 0, 0, 64, 64);
          envTexture.needsUpdate = true;
          if (pmremGenerator) {
            if (cameraRT) cameraRT.dispose();
            cameraRT = pmremGenerator.fromEquirectangular(envTexture);
            if (envMode === "cam") sceneEl.object3D.environment = cameraRT.texture;
          }
          const pixels = ctx.getImageData(0, 0, 64, 64).data;
          let total = 0;
          for (let i = 0; i < pixels.length; i += 4) total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
          const brightness = total / (pixels.length / 4);
          smoothed = smoothed + (brightness - smoothed) * 0.08;
          const exposure = 0.6 + (smoothed / 255) * 0.9;
          if (sceneEl.renderer) sceneEl.renderer.exposure = exposure;
        }, 50);

        clearInterval(waitForVideo);
      }
    }, 100);

    // 3. Load HDR fallback
    new THREE.RGBELoader().load("HDR/cinema_lobby_B-N.hdr", (hdr) => {
      hdr.mapping = THREE.EquirectangularReflectionMapping;
      originalEnv = hdr;
      sceneEl.object3D.environment = hdr;
    });
  }, {once:true});
}

function destroyARScene(){
  if (envInterval) {
    clearInterval(envInterval);
    envInterval = null;
  }
  if (arIntervalId) {
    clearInterval(arIntervalId);
    arIntervalId = null;
  }
  document.getElementById("arContainer").innerHTML = "";
}

// =====================================================
// AR LIFECYCLE
// =====================================================

function startAR(){
  console.log("[AR] startAR called");
  
  // --- SETUP AR UI FIRST ---
  history.pushState({mode:"ar", current}, "");
  destroyMV();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("arContainer").style.display = "block";
  document.getElementById("envToggle").style.display = "block";
  document.getElementById("lightDebug").style.display = "block";

  // --- LOAD 8TH WALL SCRIPTS ---
  const runtime = document.createElement("script");
  runtime.src = "./external/runtime/runtime.js";
  document.body.appendChild(runtime);

  const xr = document.createElement("script");
  xr.src = "./external/xr/xr.js";
  xr.setAttribute("async", "true");
  xr.setAttribute("data-preload-chunks", "face, slam");
  document.body.appendChild(xr);
  
  const bundle = document.createElement("script");
  bundle.src = "bundle.js";
  document.body.appendChild(bundle);

  const bridge = document.createElement("script");
  bridge.src = "bridge.js?t=" + Date.now();
  document.body.appendChild(bridge);

  // --- WAIT FOR XR8 LOADED, START IT FIRST, THEN A-FRAME ---
  const runXR = () => {
    console.log("[AR] xrloaded event received");
    if (window.XR8) {
      window.XR8.run({ cameraConfig: { direction: 'BACK' } });
      console.log("[AR] XR8.run() called - waiting for video...");
      // WAIT FOR VIDEO TO BE CREATED BEFORE CREATING A-FRAME
      setTimeout(() => {
        console.log("[AR] Creating A-Frame scene...");
        createARScene();
      }, 800);
    }
  };

  if (window.XR8) {
    runXR();
  } else {
    window.addEventListener("xrloaded", runXR, { once: true });
  }
}

function stopAR(){
  console.log("[AR] stopAR called");
  
  // Clean XR8 tracking
  if (window.XR8) {
    try {
      console.log("[AR] Pausing XR8...");
      window.XR8.pause();
    } catch (err) {
      console.warn("[AR] XR8.pause failed:", err);
    }
    try {
      console.log("[AR] Stopping XR8...");
      window.XR8.stop();
    } catch (err) {
      console.warn("[AR] XR8.stop failed:", err);
    }
    if (window.XR8.clearCameraPipelineModules) {
      try {
        console.log("[AR] Clearing camera pipeline...");
        window.XR8.clearCameraPipelineModules();
      } catch (err) {
        console.warn("[AR] XR8.clearCameraPipelineModules failed:", err);
      }
    }
    const videoEl = document.querySelector("video");
    if (videoEl) {
      videoEl.pause();
      videoEl.srcObject = null;
      console.log("[AR] Video element cleaned");
    }
  }

  console.log("[AR] Destroying AR scene...");
  destroyARScene();
  
  // Hide AR UI
  document.getElementById("lightDebug").style.display = "none";
  document.getElementById("envToggle").style.display = "none";
  
  // Clean scanning UI
  document.querySelectorAll(".mindar-ui-scanning").forEach(el => {
    el.remove();
    console.log("[AR] Removed MindAR scanning UI");
  });
  
  // Clean bridge debug panel
  const bridgePanel = document.getElementById("bridgeDebugPanel");
  if (bridgePanel) {
    bridgePanel.remove();
    console.log("[AR] Removed bridge panel");
  }
  
  // Show menu
  document.getElementById("arContainer").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
  
  console.log("[AR] Recreating model viewer...");
  createMV();
  
  console.log("[AR] stopAR complete");
}

window.addEventListener("popstate", () => stopAR());

// =====================================================
// ENVIRONMENT TOGGLE
// =====================================================

function toggleEnv(){
  const scene = document.querySelector("a-scene");
  const btn = document.getElementById("envToggle");
  if (!scene) return;

  if (envMode === "hdr") {
    if (cameraRT) scene.object3D.environment = cameraRT.texture;
    envMode = "cam";
    btn.innerText = "Env: CAM";
  } else if (envMode === "cam") {
    scene.object3D.environment = null;
    envMode = "off";
    btn.innerText = "Env: OFF";
  } else {
    scene.object3D.environment = originalEnv;
    envMode = "hdr";
    btn.innerText = "Env: HDR";
  }
}

// =====================================================
// VERSION PANEL
// =====================================================

function updateVersionPanel(){
  const panel = document.getElementById("versionPanel");
  let versionText = "VERSION v161.1\n";
  versionText += "================\n";
  if (window.RepoFusionVersions) {
    for (const [file, version] of Object.entries(window.RepoFusionVersions)) {
      versionText += `${file}: ${version}\n`;
    }
  }
  panel.textContent = versionText;
}

document.getElementById("versionPanel").addEventListener("click", function() {
  this.classList.toggle("collapsed");
});

// =====================================================
// INITIALIZATION
// =====================================================

window.addEventListener("DOMContentLoaded", () => {
  history.replaceState({mode:"menu", current}, "");
  document.getElementById("envToggle").style.display = "none";
  createMV();
  updateVersionPanel();
  
  // Monitor for version updates from bridge.js
  setInterval(() => {
    if (window.RepoFusionVersions && window.RepoFusionVersions.bridge) {
      updateVersionPanel();
    }
  }, 1000);
});
</script>

</body>
</html>
